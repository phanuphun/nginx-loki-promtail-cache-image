version: "3.8"
services: 
  client:
    build: .
    ports:
      - "8080:80"
    environment:
      - VITE_VENDING_CODE=VEDING20211564
      - VITE_API_BASE=/api
      - KONG_URL=http://10.0.1.220:20210
      - VENDING_CODE=VEDING20211564
    volumes:
      - nginx_logs:/var/log/nginx 

  promtail:
    image: grafana/promtail:2.9.0
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro   # << อ่าน log จาก volume เดียวกัน
    depends_on:
      - client
      
volumes:
  nginx_logs: {}